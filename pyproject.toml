[project]
name = "freshflow-experiment-inventory-optimisation"
version = "0.1.0"
description = "Perishable ordering demo: LightGBM quantile forecasts, conformal calibration and an inventory simulator"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "pytest>=9.2.0",
    "scikit-learn>=1.9.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["test"]